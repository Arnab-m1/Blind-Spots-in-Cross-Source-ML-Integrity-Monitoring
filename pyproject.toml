[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satml-monitoring"
version = "0.1.0"
description = "Task-conditioned security analysis for cross-source ML monitors"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
experiments = [
  "matplotlib>=3.7",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]
test = ["pytest>=7.4"]
deep-monitors = ["torch>=2.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
